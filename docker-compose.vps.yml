# Chay tren VPS: docker compose -f docker-compose.vps.yml up -d --build
# Huong dan day du: docs/trien-khai-vps.md
#
#  Internet --443--> Caddy cua edugame (giu cong 80/443, HTTPS cho ca nskiemdien.io.vn)
#           --> frontend (nginx + giao dien, ten "nskiemdien-web" tren mang nskiemdien-edge) --/api--> backend --> db
#  App nay KHONG mo cong nao ra ngoai. Mang nskiemdien-edge chi co frontend nay + web cua edugame
#  (khong noi ca mang: 2 project deu co service "backend", noi chung se goi nham).
#  backup: sao luu database moi ngay vao ./backups, giu 30 ban gan nhat.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?dat DB_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/shop
      DB_USER: shop
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?dat JWT_SECRET trong .env (it nhat 32 ky tu ngau nhien)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?dat ADMIN_PASSWORD trong .env}
      CORS_ORIGINS: https://${DOMAIN:?dat DOMAIN trong .env}
      TZ: Asia/Ho_Chi_Minh
      # VPS 2 GB RAM: gioi han bo nho Java de con cho Postgres
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:+UseSerialGC
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      default:
      edge:
        aliases: [nskiemdien-web] # Caddy cua edugame: reverse_proxy nskiemdien-web:80
    depends_on:
      - backend

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: shop
      PGPASSWORD: ${DB_PASSWORD:?}
      PGDATABASE: shop
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backups:/backups
    # sao luu luc khoi dong roi moi 24 gio; xoa ban cu hon 30 ngay
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 20
        while true; do
          f=/backups/shop-$$(date +%Y%m%d-%H%M).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "sao luu: $$f"; else rm -f "$$f.tmp"; echo "SAO LUU LOI"; fi
          find /backups -name 'shop-*.dump' -mtime +30 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  # Chep ban sao luu RA NGOAI VPS (Google Drive / OneDrive / Dropbox...) bang rclone - VPS hong / bi xoa van con du lieu.
  # Cau hinh 1 lan (docs/trien-khai-vps.md muc 6): deploy/rclone/rclone.conf + OFFSITE_REMOTE trong .env.
  # Cu 6 gio chep ban moi (copy chi chep file chua co); xoa ban tren dich cu hon OFFSITE_KEEP_DAYS ngay (mac dinh 90).
  offsite:
    image: rclone/rclone:1.68
    restart: unless-stopped
    environment:
      REMOTE: ${OFFSITE_REMOTE:-}
      KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-90}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./backups:/backups:ro
      - ./deploy/rclone:/config/rclone
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$REMOTE" ]; then
          echo "CHUA CAU HINH OFFSITE_REMOTE trong .env -> chua chep sao luu ra ngoai VPS (xem docs/trien-khai-vps.md muc 6)"
          while true; do sleep 86400; done
        fi
        sleep 60
        while true; do
          if rclone copy /backups "$$REMOTE" --include 'shop-*.dump' --max-age 7d; then
            echo "$$(date '+%F %T') da chep sao luu len [$$REMOTE], hien co $$(rclone lsf "$$REMOTE" --include 'shop-*.dump' | wc -l) ban"
          else
            echo "$$(date '+%F %T') CHEP SAO LUU RA NGOAI LOI - kiem tra ket noi / cau hinh rclone"
          fi
          rclone delete "$$REMOTE" --include 'shop-*.dump' --min-age "$${KEEP_DAYS}d" || true
          sleep 21600
        done
    depends_on:
      - backup

volumes:
  dbdata:

networks:
  # Mang dung chung voi Caddy cua edugame. Ca 2 project deu khai bao external -> tao 1 LAN tren VPS, khong phu thuoc
  # thu tu deploy:   docker network create nskiemdien-edge
  edge:
    name: nskiemdien-edge
    external: true
