server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # manifest "Them vao man hinh chinh" (nginx mac dinh khong biet duoi .webmanifest)
  types { application/manifest+json webmanifest; }
  include /etc/nginx/mime.types;

  # nen cho nhe khi dung 4G
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # IP that cua nguoi dung (Caddy tren VPS dat san) -> backend gioi han dang nhap sai theo IP
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 120s; # xuat PDF / bao cao lon
    client_max_body_size 4m; # anh nen man dang nhap (backend gioi han 3 MB; nginx mac dinh chi 1 MB)
  }

  # file co ma bam trong ten (vite build) -> cache lau; cap nhat ban moi la ten file doi
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html khong cache -> cap nhat ban moi la dien thoai nhan ngay
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
