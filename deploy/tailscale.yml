# Che do "chi thiet bi cua minh": web KHONG mo ra Internet, chi may tinh / dien thoai da cai Tailscale (cung tai khoan) vao duoc.
#   docker compose -f docker-compose.vps.yml -f deploy/tailscale.yml up -d --build
#   tailscale serve --bg --https=443 http://127.0.0.1:8081      # HTTPS hop le: https://<ten-vps>.<tailnet>.ts.net
# Huong dan: docs/trien-khai-vps.md muc 9.
services:
  caddy:
    profiles: ["tat"]          # khong chay Caddy, khong mo cong 80/443
  frontend:
    ports:
      - "127.0.0.1:8081:80"    # chi trong VPS; Tailscale chuyen vao
