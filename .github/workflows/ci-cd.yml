# CI/CD: moi lan main thay doi (va moi pull request) -> test; main dat het test -> deploy len VPS.
#
#  backend   : test Java (H2)                ┐
#  frontend  : test + kiem tra kieu + build   ├─> deploy (chi push len main, chi khi da cai Secrets VPS)
#  docker    : build thu image nhu tren VPS   ┘     SSH vao VPS -> deploy/deploy.sh <commit>:
#                                                   sao luu DB -> lay code -> build -> kiem tra -> loi thi quay ve
# Test qua giao dien (scripts/*.cjs: IT, E2E, dang nhap, tung man) KHONG chay tren CI (lau) - chay tay khi can.
#
# Cai dat deploy: docs/trien-khai-vps.md muc 10 (Secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS...).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # chay tay o tab Actions

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B test
        working-directory: backend

  frontend:
    name: Test + build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  docker:
    name: Build Docker image (nhu tren VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: # gia tri gia - chi de compose doc duoc file, khong chay that
      DB_PASSWORD: ci
      JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      ADMIN_PASSWORD: ci
      DOMAIN: ci.local
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.vps.yml build backend frontend

  deploy:
    name: Deploy len VPS
    needs: [backend, frontend, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Muon duyet tay truoc moi lan deploy: Settings -> Environments -> production -> Required reviewers
    environment: production
    concurrency: { group: deploy-production, cancel-in-progress: false } # khong deploy chong nhau
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Chua cai VPS -> bo qua
        if: env.VPS_HOST == ''
        run: echo "Chua co Secrets VPS_HOST... -> bo qua deploy (xem docs/trien-khai-vps.md muc 10)" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy qua SSH
        if: env.VPS_HOST != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # chi tin dung may VPS da khai bao (chong gia mao may chu)
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "cd '${VPS_APP_DIR:-/opt/cuahang}' && git fetch --quiet origin main && git checkout --quiet --force origin/main -- deploy/deploy.sh && bash deploy/deploy.sh '${{ github.sha }}'" \
            | tee deploy.log
          echo "Da deploy ${GITHUB_SHA::7} len VPS" >> "$GITHUB_STEP_SUMMARY"
