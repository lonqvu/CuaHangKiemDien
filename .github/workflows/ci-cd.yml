# CI/CD: moi lan main thay doi (va moi pull request) -> test; main dat het test -> deploy len VPS.
#
#  backend   : test Java (H2)                         ┐
#  frontend  : test + kiem tra kieu + build            ├─> deploy (chi push len main, chi khi da cai Secrets VPS)
#  giao-dien : IT, E2E, dang nhap, tung man (PostgreSQL)│     SSH vao VPS -> deploy/deploy.sh <commit>:
#  docker    : build thu image nhu tren VPS            ┘     sao luu DB -> lay code -> build -> kiem tra -> loi thi quay ve
#
# Cai dat deploy: docs/trien-khai-vps.md muc 10 (Secrets VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS...).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # chay tay o tab Actions

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Test backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: ./mvnw -B test
        working-directory: backend

  frontend:
    name: Test + build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm test && npm run build
        working-directory: frontend

  giao-dien:
    name: Test qua giao dien (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: shop
      TZ: Asia/Ho_Chi_Minh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build backend
        run: ./mvnw -B -q -DskipTests package
        working-directory: backend
      - name: Cai frontend + Playwright
        run: |
          (cd frontend && npm ci)
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y -qq poppler-utils # pdftotext: IT / E2E doc noi dung PDF hoa don, phieu thu
      - name: Chay frontend (vite)
        run: (cd frontend && nohup npx vite --port 5173 > ../vite.log 2>&1 &)
      - name: Chay cac bo test (moi bo 1 database trong)
        run: |
          set -u
          fail=0
          for t in it-toan-he-thong e2e-ban-hang test-dang-nhap test-tung-man; do
            pkill -f shop-backend || true; sleep 2
            db="t_${t//-/_}"
            psql -h localhost -U shop -d postgres -qc "drop database if exists $db" -c "create database $db"
            DB_URL="jdbc:postgresql://localhost:5432/$db" DB_USER=shop DB_PASSWORD=shop \
              nohup java -jar backend/target/shop-backend-0.1.0.jar > "backend-$t.log" 2>&1 &
            for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8090/api/auth/login && break; sleep 2; done
            echo "::group::$t"
            if node "scripts/$t.cjs" > "ket-qua-$t.txt" 2>&1; then r=OK; else r=LOI; fail=1; fi
            grep -E "^FAIL" "ket-qua-$t.txt" | head -20 || true
            echo "::endgroup::"
            echo "$t: $r - $(tail -1 "ket-qua-$t.txt")" | tee -a tong-ket.txt
          done
          pkill -f shop-backend || true
          cat tong-ket.txt >> "$GITHUB_STEP_SUMMARY"
          exit $fail
      - name: Luu log khi loi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-test-giao-dien
          path: |
            ket-qua-*.txt
            backend-*.log
            vite.log
          retention-days: 7

  docker:
    name: Build Docker image (nhu tren VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: # gia tri gia - chi de compose doc duoc file, khong chay that
      DB_PASSWORD: ci
      JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
      ADMIN_PASSWORD: ci
      DOMAIN: ci.local
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.vps.yml build backend frontend

  deploy:
    name: Deploy len VPS
    needs: [backend, frontend, giao-dien, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Muon duyet tay truoc moi lan deploy: Settings -> Environments -> production -> Required reviewers
    environment: production
    concurrency: { group: deploy-production, cancel-in-progress: false } # khong deploy chong nhau
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Chua cai VPS -> bo qua
        if: env.VPS_HOST == ''
        run: echo "Chua co Secrets VPS_HOST... -> bo qua deploy (xem docs/trien-khai-vps.md muc 10)" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy qua SSH
        if: env.VPS_HOST != ''
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # chi tin dung may VPS da khai bao (chong gia mao may chu)
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "cd '${VPS_APP_DIR:-/opt/cuahang}' && git fetch --quiet origin main && git checkout --quiet --force origin/main -- deploy/deploy.sh && bash deploy/deploy.sh '${{ github.sha }}'" \
            | tee deploy.log
          echo "Da deploy ${GITHUB_SHA::7} len VPS" >> "$GITHUB_STEP_SUMMARY"
