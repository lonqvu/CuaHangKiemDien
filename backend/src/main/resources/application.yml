# Local mac dinh 8090 (8080 hay bi app khac chiem). docker-compose dat SERVER_PORT=8080.
server:
  port: ${SERVER_PORT:8090}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/shop}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-change-me}
    expiration-minutes: 480
    # "Ghi nho dang nhap tren may nay": phien keo dai so ngay nay (khong tich: expiration-minutes)
    remember-days: ${JWT_REMEMBER_DAYS:7}
    # "Khong hoi ma 2 lop tren may nay" giu bao nhieu ngay
    trust-device-days: ${TRUST_DEVICE_DAYS:7}
  seed-admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin123}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  stock:
    # Ban ton theo tam tru kho bao nhieu: total = Tong SL (SL x tam x he so, mac dinh);
    # without-factor = SL x so tam (he so 1.08 chi de tinh tien, khong phai hang xuat that)
    sale-quantity: ${STOCK_SALE_QTY:without-factor}
  # SEED_DEMO=true: tao du lieu mau (san pham, khach, ~14 thang hoa don) neu DB chua co san pham/hoa don. KHONG bat tren server that.
  seed-demo: ${SEED_DEMO:false}
  report:
    # Dinh dang so tren hoa don in (Jasper). App cu chay locale en-US -> 1,234,567. Doi thanh vi-VN neu muon 1.234.567
    locale: ${REPORT_LOCALE:en-US}
